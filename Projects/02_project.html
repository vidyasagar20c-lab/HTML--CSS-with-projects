<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <div style=" float: inline-end;width:80px;height: 100px;border: 1px solid black;"></div>
    <h1>Registration From</h1>
    <div>
    <label>Name</label>
    <input type="text" placeholder="Enter your Name"></input>
    </div>
    <div>
    <label >Email</label>
    <input type="email" placeholder="Enter your email addres">
    </div>
    <div>
        <label>Password</label>
        <Input type="password" placeholder="Password"></Input>
        </div>
        <div>   
        <label>Phone</label>
        <input type="tel" placeholder="Mobile Number">
        </div>
        <div>
        <label>Gender</label>
        <Input type="radio" name="radio" value="Male" id="Male">Male</Input>
        <Input type="radio"name="radio" value="Female" id="Female">Female</Input>
        <Input type="radio"name="radio" value="other" id="other">Other</Input>
        </div>
        <div>
        <label>Hobbies</label>
        <Input type="checkbox">Cricket</Input>
        <Input type="checkbox">football</Input>
        <Input type="checkbox">Hockey</Input>
        <Input type="checkbox">Tennis</Input>
        <Input type="checkbox">Bollyball</Input>
        </div>
        <div>
        <label>Date of Birth</label>
        <Input type="date"></Input>
        </div>
        <div>
        <label>City</label>
        <select >
          <option>Noida</option>
          <option>Greater Noida</option>
          <option>Gaziyabad</option>
          <option>Faridabad</option>
          <option>Meerut</option>
          <option>Jaipur</option>
          <option>Mathura</option>
          <option>Raipur</option>
          <option>Delhi</option>
        </select>
        </div>
        <div>
        <label>Profile Photo</label>
        <Input type="file" accept="image/*"></Input>
        </div>
        </div>
        <label>Favorite Color</label>
        <Input type="Color"></Input>
        <div>
            <label>Range</label>
            <input type="range" min="0" max="100">100</input>
        </div>
        <div>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
        </div>
        </div>
    </div>
</body>
</html>
