<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .main{
            height:100vh;
            width: 100vw;
        }

        .first,
        .second,
        .third,
        .fourth,
        .fifth{
            height: 80%;
            width: 80%;
        }
        .main,
        .second,
        .fourth{
            background-color: red;

        }

        .first,
        .third,
        .fifth{
            background-color: white;
        }
        .box{
            background-color: white;
            color: white;
            height: 100px;
            width: 100px;
            display: flex;
        justify-content: center;
        align-items: center;
        }
    #box1{
        background-color: purple;
        position: absolute;
        top: 0;
        left: 0;
    }
    #box2{
        background-color: green;
        position: absolute;
        bottom: 0;
        left: 0;
    }
    #box3{
        background-color: navy;
    }
    #box4{
        background-color: orange;
        position: absolute;
        top: 0;
        right: 0;
    }
    #box5{
        background-color: yellow;
        position: absolute;
        bottom: 0;
        right: 0;
    }
    .main,
    .first,
    .second,
    .third,
    .fourth,
    .fifth{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .main:hover,
    .first:hover,
    .second:hover,
    .third:hover,
    .fourth:hover,
    .fifth:hover{
        position: relative;
    }
    </style>
</head>
<body>
    <div class="main">
        <div class="first">
            <div class="second">
                <div class="third">
                    <div class="fourth">
                        <div class="fifth">
                            <div class="box" id="box1">box1</div>
                            <div class="box" id="box2">box2</div>
                            <div class="box" id="box3">box3</div>
                            <div class="box" id="box4">box4</div>
                            <div class="box" id="box5">box5</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
